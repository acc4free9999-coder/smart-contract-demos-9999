services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
    ports:
      - "8545:8545"
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - BLOCKCHAIN_RPC_URL=http://anvil:8545
      - DATABASE_URL=sqlite:////app/loyalty.db
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn server.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - anvil
